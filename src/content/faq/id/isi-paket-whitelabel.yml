pertanyaan: Apa saja yang didapatkan pada paket Custom Whitelabel?
jawaban: Pada paket **Custom Whitelabel**, seluruh antarmuka dasbor admin maupun portal mitra menggunakan logo, palet warna, domain penuh, dan notifikasi email perusahaan Anda sendiri tanpa mencantumkan nama Channelory. Paket ini juga mencakup opsi server terdedikasi (private cloud), kustomisasi alur pencairan dana lokal, serta integrasi ERP/POS internal perusahaan Anda.
