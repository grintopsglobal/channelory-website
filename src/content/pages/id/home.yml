tentang:
  eyebrow: Tentang Channelory
  judul: Menjembatani Dunia Afiliasi Digital dan Distribusi Fisik dalam Satu Arsitektur Modern
  paragraf1: Banyak platform pelacakan afiliasi global hanya berhenti pada tautan referral digital. Padahal di dunia nyata, pertumbuhan brand modern bertumpu pada kombinasi **konten kreator online, jaringan reseller yang menyetok barang, agen daerah berjenjang, hingga gerai franchise**.
  paragraf2: '**Channelory** dibangun dengan prinsip *"Unifying partners, optimizing networks."* Prinsip ini memberi satu pusat kendali bagi pemilik merek dan tim operasional untuk merancang aturan komisi, mengawasi pergerakan inventori, dan menghubungkan data penjualan langsung ke sistem akuntansi maupun ERP perusahaan.'
  pilar:
    - label: Visi Produk
      judul: Omnichannel Partner Infrastructure
      deskripsi: Menghilangkan sekat antara tim digital marketing (afiliasi) dan tim sales distribusi (agen/franchise).
    - label: Arsitektur Terbuka
      judul: Storefront & ERP Native
      deskripsi: Dirancang agar mudah dipasang di WooCommerce/Shopify sekaligus siap terhubung ke Odoo dan ERPNext.
    - label: Keamanan Enterprise
      judul: RBAC & Audit Trail Lengkap
      deskripsi: Pemisahan hak akses ketat antara tim operasional mitra, bagian gudang, dan tim keuangan pencairan.
    - label: Skalabilitas
      judul: Dari 10 ke 10.000+ Mitra
      deskripsi: Struktur database hierarki yang tetap responsif menghitung komisi berjenjang secara real-time.
